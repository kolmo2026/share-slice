<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>株式希薄化シナリオ計算機 — 一株のしくみノート</title><meta name="description" content="発行、RSU、行使、買い戻しのシナリオをローカル計算し、株数増加率と持分希薄化率を区別します。"><link rel="canonical" href="https://filings.optmodel.com/ja/tool/"><link rel="alternate" hreflang="en" href="https://filings.optmodel.com/en/tool/"><link rel="alternate" hreflang="ja" href="https://filings.optmodel.com/ja/tool/"><link rel="alternate" hreflang="x-default" href="https://filings.optmodel.com/en/tool/"><link rel="stylesheet" href="/assets/style.css"><meta property="og:title" content="株式希薄化シナリオ計算機 — 一株のしくみノート"><meta property="og:description" content="発行、RSU、行使、買い戻しのシナリオをローカル計算し、株数増加率と持分希薄化率を区別します。"><meta property="og:url" content="https://filings.optmodel.com/ja/tool/"><meta property="og:type" content="website"><meta property="og:site_name" content="一株のしくみノート"><meta property="og:locale" content="ja_JP"><meta property="og:locale:alternate" content="en_US"></head><body class="shares"><a class="skip" href="#main">本文へ</a><header><a class="wordmark" href="/ja/">一株のしくみノート</a><span class="edition">調査のための計算ノート / 01</span><nav aria-label="メインナビゲーション"><a href="/ja/">ホーム</a><a href="/ja/tool/">ツール</a><a href="/ja/about/">運営について</a><a lang="en" hreflang="en" href="/en/tool/">English</a></nav></header><main id="main"><div class="section-label">分母を見える形にする、一株あたりの考え方</div><h1>株式希薄化シナリオ計算機</h1><p>合成サンプルを表示しています。計算はブラウザー内で行い、入力を送信しません。</p><p class="note">保有株数と期間利益を固定した期末シナリオです。法定希薄化後EPSではありません。</p><form id="calculator" class="tool-panel"><div class="fields"><label>開始時の総株数<input name="shares" type="number" min="1" step="1" required></label><label>自分の保有株数<input name="holding" type="number" min="0" step="1" required></label><label>期間純利益（損失可）<input name="income" type="number" step="any" required></label><label>通貨ラベル<input name="currency" maxlength="3" pattern="[A-Za-z]{3}" required></label></div><h2>株数イベント（順に反映）</h2><div id="events"></div><div class="actions"><button id="add-event" type="button" class="quiet">イベントを追加</button><button type="submit">再計算</button><button id="example" type="button" class="quiet">サンプルを読込</button><button id="save" type="button" class="quiet">JSONを保存</button></div><label>JSONシナリオを再読込<input id="load" type="file" accept=".json,application/json"></label></form><p id="error" role="status" aria-live="polite"></p><div id="output" aria-live="polite"></div><p>イベントを変えた後は「再計算」を押してください。内部エラーメッセージは英語です。</p></main><aside class="reading-nav"><h2>このノートの内容</h2><a href="/ja/dilution-walkthrough/">希薄化の計算例</a><a href="/ja/method-and-limits/">計算方法と会計上の制約</a></aside><footer><p>ローカルな道具。明示した前提。再現できる作業。</p><a href="https://github.com/kolmo2026/share-slice">GitHub · MIT</a> <a href="/ja/about/">運営について</a></footer><script type="module" src="/assets/app.js"></script></body></html>
